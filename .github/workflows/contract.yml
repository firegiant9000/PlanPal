# Contract check (Phase 1).
#
# Verifies the OpenAPI spec is valid and that the generated types in
# @planpal/types are in sync with it (drift = failed build). Scoped to the
# Phase 1 deliverable; the full lint/test/deploy CI/CD pipeline is added in
# Phase 3 (see MONTH_1_PLAN.md) and can extend or absorb this workflow.
name: contract

on:
  pull_request:
    paths:
      - 'packages/api-contract/**'
      - 'packages/types/**'
      # The spec also generates the Edge Functions' wire types, so a hand-edit
      # there has to trigger this workflow too.
      - 'supabase/functions/_shared/contract-types.ts'
      - '.github/workflows/contract.yml'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint OpenAPI spec
        run: pnpm --filter @planpal/api-contract validate

      - name: Regenerate types from spec
        run: pnpm --filter @planpal/api-contract generate

      # Two outputs from one spec: the client types in @planpal/types and the
      # Edge Functions' wire types. `generate` emits both, so both are diffed —
      # otherwise the backend half could drift silently while the frontend half
      # stayed honest, which is how three hand-written copies of `Event` came
      # to exist in the first place.
      - name: Fail if generated types drift from the spec
        run: |
          if ! git diff --exit-code -- packages/types/src/generated supabase/functions/_shared/contract-types.ts; then
            echo "::error::Generated types are out of date. Run 'pnpm contract:generate' and commit BOTH outputs."
            exit 1
          fi

      - name: Typecheck workspace
        run: pnpm typecheck
