# Phase 3 — staging auto-deploy on merge to main.
#
# Promotes a merged commit to the STAGING environment: applies DB migrations to
# the staging Supabase project and deploys the web app. Each external step is
# guarded on its secret, so this workflow stays green until the cloud accounts
# are wired (those are manual steps — see docs/ENVIRONMENTS.md), then activates
# automatically once the corresponding GitHub secrets exist.
#
# Required repository/Environment secrets (set under Settings → Environments → staging):
#   SUPABASE_ACCESS_TOKEN          Supabase personal access token
#   SUPABASE_STAGING_PROJECT_REF   ref of the planpal-staging project
#   SUPABASE_STAGING_DB_PASSWORD   staging Postgres password (for db push)
#   VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID   web deploy (if using Vercel)
name: deploy-staging

on:
  push:
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations to staging Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::notice::Supabase staging secrets not set — skipping migration push. See docs/ENVIRONMENTS.md."
            exit 0
          fi
          npx --yes supabase@latest link --project-ref "$PROJECT_REF"
          npx --yes supabase@latest db push

  deploy-web:
    runs-on: ubuntu-latest
    needs: migrate
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter @planpal/web build

      - name: Deploy web to Vercel (staging)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN not set — skipping web deploy. Wire a host per docs/ENVIRONMENTS.md."
            exit 0
          fi
          npx --yes vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN"
