# Phase 3 — staging auto-deploy on merge to main.
#
# Promotes a merged commit to the STAGING environment: applies DB migrations,
# deploys the Edge Functions, proves the result is actually alive, then deploys
# the web app.
#
# WHY THE `configured` GATE: the cloud accounts are provisioned by hand (see
# docs/ENVIRONMENTS.md), so until the secrets exist this workflow deliberately
# does nothing and stays green. That is the ONLY thing it is allowed to be quiet
# about. Once the secrets are set, every step fails loudly — a deploy that
# half-worked must not report success. The previous version guarded each step on
# its own secret and `exit 0`d, which made "not configured" and "broken"
# indistinguishable.
#
# Required secrets (Settings → Environments → staging):
#   SUPABASE_ACCESS_TOKEN          Supabase personal access token
#   SUPABASE_STAGING_PROJECT_REF   ref of the planpal-staging project
#   SUPABASE_STAGING_DB_PASSWORD   staging Postgres password (for db push)
#   SUPABASE_STAGING_ANON_KEY      staging anon key (for the /healthz check)
#   VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID   web deploy (if using Vercel)
name: deploy-staging

on:
  push:
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  supabase:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Are the staging secrets configured?
        id: gate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::notice::Supabase staging secrets not set — skipping the whole Supabase deploy. See docs/ENVIRONMENTS.md."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Link staging project
        if: steps.gate.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
        run: npx --yes supabase@latest link --project-ref "$PROJECT_REF"

      - name: Apply migrations
        if: steps.gate.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
        run: npx --yes supabase@latest db push

      # Every function, enumerated by the CLI rather than by hand. A written-out
      # list is what let ci.yml silently stop type-checking two functions this
      # repo had added — the same mistake here would leave a stale API deployed
      # against a freshly-migrated database, which is worse.
      - name: Deploy Edge Functions
        if: steps.gate.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
        run: npx --yes supabase@latest functions deploy --project-ref "$PROJECT_REF"

      # The reason /healthz exists. `db push` and `functions deploy` can both
      # report success while the deployed API cannot reach its database, so the
      # deploy is not finished until something has actually answered.
      - name: Smoke-check /healthz
        if: steps.gate.outputs.configured == 'true'
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
        run: |
          if [ -z "$ANON_KEY" ]; then
            echo "::error::SUPABASE_STAGING_ANON_KEY is not set, so the deploy cannot be verified. Add it (Settings → Environments → staging)."
            exit 1
          fi
          url="https://${PROJECT_REF}.supabase.co/functions/v1/healthz"
          echo "GET $url"
          code=$(curl -sS -o response.json -w '%{http_code}' \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            "$url")
          echo "HTTP $code"
          cat response.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::/healthz returned HTTP $code — staging is not serving a healthy API."
            exit 1
          fi
          # 200 is necessary but not sufficient: the probe reports an unreachable
          # database in the body, and a proxy error page would also be a 200.
          if ! grep -q '"status":"ok"' response.json; then
            echo "::error::/healthz answered 200 but not {\"status\":\"ok\"} — the API is up but unhealthy."
            exit 1
          fi

  deploy-web:
    runs-on: ubuntu-latest
    needs: supabase
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter @planpal/web build

      - name: Deploy web to Vercel (staging)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN not set — skipping web deploy. Wire a host per docs/ENVIRONMENTS.md."
            exit 0
          fi
          npx --yes vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN"
