# Dependabot: one pull request a month covering every ecosystem in this repo.
#
# - All minor and patch updates land together in a single "monthly-dependencies" PR.
# - Major version bumps of libraries are ignored here; take those deliberately
#   in their own branch. GitHub Actions majors are included (they rarely break).
# - Security updates are separate: Dependabot opens those as soon as an
#   advisory affects a dependency, regardless of this schedule.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/configuring-multi-ecosystem-updates
version: 2

multi-ecosystem-groups:
  monthly-dependencies:
    schedule:
      interval: "monthly"

updates:
  - package-ecosystem: "npm"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "monthly-dependencies"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Packages the Expo SDK pins (expo/bundledNativeModules.json). CI fails
      # any PR that moves one off its pin (`expo install --check` in ci.yml),
      # so a monthly PR that bumps them can never merge. They move together,
      # with `npx expo install --fix`, when the SDK itself is upgraded. The
      # React type packages are listed because they follow the pinned React.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "jest-expo"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: "@sentry/react-native"
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "monthly-dependencies"
